name: Update README Project List

# Runs automatically:
#  - every time you push to this repo
#  - once a week on its own (Sunday midnight UTC), so new repos you create
#    in OTHER repositories still get picked up
#  - manually any time from the Actions tab ("Run workflow")
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch repos & regenerate project table
        env:
          GH_USERNAME: 0609Abhinav
          # GITHUB_TOKEN is provided automatically by Actions — no setup needed
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.js

      - name: Commit changes if README updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: auto-update project list [skip ci]"
            git push
          else
            echo "No changes to README.md — nothing to commit."
          fi
