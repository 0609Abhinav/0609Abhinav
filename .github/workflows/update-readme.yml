name: Update README

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch:

jobs:
  update-readme:
    name: Update GitHub Stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate GitHub Stats (uses anuraghazra's API)
        run: |
          curl -s https://github-readme-stats.vercel.app/api?username=0609Abhinav\&count_private=true\&show_icons=true > stats.svg
          curl -s https://github-readme-streak-stats.herokuapp.com?user=0609Abhinav > streak.svg

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "📊 Daily README stats update"
          git push
